# ============================================================================
# TERMINAL & COLOR CONFIGURATION
# ============================================================================

# Critical for proper colors in Neovim + Alacritty
# Use tmux-256color for better compatibility
set -g default-terminal "tmux-256color"

# Enable true color (24-bit) support
# This is essential for Neovim themes to work correctly
set -ag terminal-overrides ",alacritty:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"

# Better terminal compatibility
set -ga terminal-overrides ',xterm-256color:Tc'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Enable undercurl support for Neovim diagnostics
set -as terminal-features ',alacritty:usstyle'

# Allow passthrough of escape sequences
set -g allow-passthrough on

# ============================================================================
# PREFIX & BASIC SETTINGS
# ============================================================================

# Change prefix from C-b to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reduce escape time for better Neovim experience
set -sg escape-time 10

# Focus events for file watchers
set -g focus-events on

# ============================================================================
# WINDOW & PANE MANAGEMENT
# ============================================================================

# Split panes using | and -
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Quick window creation preserving current path
bind c new-window -c "#{pane_current_path}"

# Reload config with feedback
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Resize panes
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Maximize pane
bind -r m resize-pane -Z

# ============================================================================
# NAVIGATION & VIM INTEGRATION
# ============================================================================

# Enable vim mode
set-window-option -g mode-keys vi

# Better copy mode bindings
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
# bind-key -T copy-mode-vi 'r' send -X rectangle-toggle

# Cancel copy mode with Escape
bind-key -T copy-mode-vi Escape send -X cancel

# Don't exit copy mode on mouse drag end
unbind -T copy-mode-vi MouseDragEnd1Pane

# ============================================================================
# MOUSE SUPPORT
# ============================================================================

# Enable mouse
set -g mouse on

# Better mouse scrolling
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# ============================================================================
# INDEXING & HISTORY
# ============================================================================

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer (10k)
set -g history-limit 10000

# ============================================================================
# STATUS BAR & DISPLAY
# ============================================================================

# Update status bar every 5 seconds
set -g status-interval 5

# Enable activity monitoring
set -g monitor-activity on
set -g visual-activity off  # to avoid disruption

# Better status bar positioning
set -g status-position bottom

# Window title
set -g set-titles on
set -g set-titles-string '#S ● #W'

# ============================================================================
# PERFORMANCE OPTIMIZATIONS
# ============================================================================

# Improve rendering performance
set -g default-command "${SHELL}"

# Don't rename windows automatically (off)
set -g automatic-rename on

# Aggressive resize - useful when sharing sessions
setw -g aggressive-resize on

# Force window size
set -g window-size latest

# ============================================================================
# CLIPBOARD INTEGRATION
# ============================================================================

# Enable clipboard
set -g set-clipboard on

# Copy to system clipboard
if-shell "uname | grep -q Darwin" \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"'

# ============================================================================
# PLUGIN CONFIGURATION
# ============================================================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control' # https://github.com/tmux-plugins/tmux-pain-control
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator' # Essential for Neovim integration
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'  # Better yanking support
set -g @plugin 'tmux-plugins/tmux-copycat'  # Better searching

# Theme configuration
set -g @themepack 'powerline/default/green'

# Resurrect configuration
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'  # Save Neovim sessions

# Continuum configuration
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'  # Save every 10 minutes

# Initialize TMUX plugin manager (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
